[package]
name = "writestuff"
version = "0.1.0"
edition = "2024"
description = "just a place to write stuff."
license = "MIT"

[dependencies]
iced = { version = "0.14", features = ["tokio", "highlighter", "markdown"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tokio = { version = "1", features = ["rt"] }

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
